<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a4a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<title>Tempo</title>
<style>
:root{
  --lime:#a0ff2d; --stage:#1c1c1c; --chrome:#4a4a4a; --panel:#333333;
  --line:#5c5c5c; --ink:#d0d0d0; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--ink);
  font-family:-apple-system,"Helvetica Neue","Hiragino Sans",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--lime);outline-offset:4px;border-radius:12px}
svg{display:block}

.app{height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* header */
.head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  padding:8px 16px 10px}
.head h1{margin:0;text-align:center;font-size:32px;font-weight:300;letter-spacing:.02em}
.head button{width:44px;height:44px;display:grid;place-items:center}
.rule{height:4px;background:var(--lime);flex:none}

/* beat lamps */
.stage{flex:1;min-height:120px;background:var(--stage);display:flex;align-items:center;
  justify-content:center;padding:0 6vw}
.dots{display:flex;gap:5vw;width:100%;justify-content:center}
.dot{flex:1;max-width:120px;aspect-ratio:1;border-radius:50%;background:var(--lime);
  display:grid;place-items:center;transition:opacity .12s}
.playing .dot{opacity:.18}
.playing .dot.on{opacity:1}

/* controls */
.controls{flex:none;padding:14px 16px 8px}
.card{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:24px}
.bpm{display:flex;align-items:center;padding:14px 22px 10px}
.bpm .step{width:44px;height:64px;display:grid;place-items:center}
.eq{display:flex;align-items:center;gap:2px;margin-left:2px}
.eq span{font-size:18px}
.mid{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px}
.num{font-size:min(22vw,100px);font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums}
.unit{font-size:14px}
.divider{height:1px;background:var(--line);margin:0 22px}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 34px}
.name{font-size:24px;font-weight:300;font-style:italic;white-space:nowrap}
.tap{font-size:24px;font-weight:300;padding:8px 6px}
.tap:active{color:var(--lime)}
.play{position:absolute;left:50%;bottom:0;width:104px;height:104px;border-radius:50%;
  transform:translate(-50%,50%);background:var(--panel);border:1.5px solid var(--line);
  display:grid;place-items:center}
.play:active{background:#3d3d3d}
.bar{height:80px;display:flex;align-items:flex-start;padding:10px 32px 0}
.sig{font-size:44px;font-weight:200;line-height:1}

@media (prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <button id="mute" aria-label="クリック音のオン・オフ"></button>
    <h1>TEMPO</h1>
    <span></span>
  </header>
  <div class="rule"></div>

  <main class="stage"><div class="dots" id="dots" aria-label="拍"></div></main>

  <section class="controls">
    <div class="card">
      <div class="bpm">
        <button class="step" id="minus" aria-label="BPMを下げる">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12h16"/></svg>
        </button>
        <div class="eq">
          <svg width="22" height="26" viewBox="0 0 24 24"><ellipse cx="8.5" cy="18" rx="4" ry="3" fill="currentColor" transform="rotate(-18 8.5 18)"/><path d="M12 17.5V3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>=</span>
        </div>
        <div class="mid">
          <span class="num" id="num">98</span><span class="unit">BPM</span>
        </div>
        <button class="step" id="plus" aria-label="BPMを上げる">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12h16M12 4v16"/></svg>
        </button>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="name" id="name">Allegretto</span>
        <button class="tap" id="tap">TAP</button>
      </div>
      <button class="play" id="play" aria-label="再生"></button>
    </div>
    <div class="bar"><button class="sig" id="sig" aria-label="拍子を変える">4/4</button></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const ICON = {
  play:'<svg width="52" height="52" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
  stop:'<svg width="48" height="48" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5" fill="currentColor"/></svg>',
  on:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9c1.3 1.7 1.3 4.3 0 6M18.3 6.5c2.8 3 2.8 8 0 11"/></svg>',
  off:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>',
  accent:'<svg width="40%" height="40%" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.38)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L12 5l7 14"/></svg>'
};

let bpm = 98, beats = 4, playing = false, muted = false;
let ctx = null, timer = null, nextTime = 0, beatIdx = 0, wakeLock = null;
const queue = [];

function tempoName(b){
  if (b < 40) return 'Grave';
  if (b < 60) return 'Largo';
  if (b < 66) return 'Larghetto';
  if (b < 76) return 'Adagio';
  if (b < 92) return 'Andante';
  if (b < 108) return 'Allegretto';
  if (b < 120) return 'Moderato';
  if (b < 156) return 'Allegro';
  if (b < 176) return 'Vivace';
  if (b < 200) return 'Presto';
  return 'Prestissimo';
}

/* ---------- 画面更新 ---------- */
function renderBpm(){ $('num').textContent = bpm; $('name').textContent = tempoName(bpm); }
function renderDots(){
  $('dots').innerHTML = Array.from({length:beats}, (_, i) =>
    '<div class="dot">' + (i === 0 ? ICON.accent : '') + '</div>').join('');
  $('sig').textContent = beats + '/4';
}
function setActive(i){
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === i));
}
function renderPlay(){
  $('play').innerHTML = playing ? ICON.stop : ICON.play;
  $('play').setAttribute('aria-label', playing ? '停止' : '再生');
  $('app').classList.toggle('playing', playing);
}
function renderMute(){ $('mute').innerHTML = muted ? ICON.off : ICON.on; }

function setBpm(v){ bpm = Math.min(300, Math.max(30, Math.round(v))); renderBpm(); }

/* ---------- 音 (Web Audio: 先読みスケジューラ) ---------- */
function click(time, accent){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = accent ? 1500 : 1000;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(0.8, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  o.connect(g).connect(ctx.destination);
  o.start(time); o.stop(time + 0.06);
}
function scheduler(){
  while (nextTime < ctx.currentTime + 0.12){
    const b = beatIdx % beats;
    if (!muted) click(nextTime, b === 0);
    queue.push({b, t: nextTime});
    nextTime += 60 / bpm;
    beatIdx++;
  }
}
function draw(){
  if (!playing) return;
  const now = ctx.currentTime - (ctx.outputLatency || 0);
  while (queue.length && queue[0].t <= now) setActive(queue.shift().b);
  requestAnimationFrame(draw);
}

async function start(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (navigator.audioSession) navigator.audioSession.type = 'playback'; // iPhoneのマナーモードでも鳴らす
  if (ctx.state !== 'running') await ctx.resume();
  playing = true; beatIdx = 0; queue.length = 0;
  nextTime = ctx.currentTime + 0.06;
  scheduler();
  timer = setInterval(scheduler, 25);
  requestAnimationFrame(draw);
  renderPlay();
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
function stop(){
  playing = false;
  clearInterval(timer); queue.length = 0;
  setActive(-1);
  renderPlay();
  try { wakeLock?.release(); } catch (e) {}
  wakeLock = null;
}

/* ---------- タップテンポ ---------- */
let taps = [];
function tapTempo(){
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  taps = taps.slice(-6);
  if (taps.length < 2) return;
  const gaps = taps.slice(1).map((t, i) => t - taps[i]);
  setBpm(60000 / (gaps.reduce((a, b) => a + b, 0) / gaps.length));
}

/* ---------- 操作 ---------- */
function holdable(btn, fn){
  let t, i;
  const end = () => { clearTimeout(t); clearInterval(i); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); fn();
    t = setTimeout(() => { i = setInterval(fn, 70); }, 400);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, end));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
holdable($('minus'), () => setBpm(bpm - 1));
holdable($('plus'),  () => setBpm(bpm + 1));
$('tap').addEventListener('pointerdown', e => { e.preventDefault(); tapTempo(); });
$('play').addEventListener('click', () => playing ? stop() : start());
$('mute').addEventListener('click', () => { muted = !muted; renderMute(); });
$('sig').addEventListener('click', () => {
  beats = beats >= 7 ? 2 : beats + 1;
  beatIdx = 0; queue.length = 0;
  renderDots();
  if (playing) setActive(-1);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && playing && !wakeLock) navigator.wakeLock?.request('screen').then(l => wakeLock = l).catch(() => {});
});

renderBpm(); renderDots(); renderPlay(); renderMute();
</script>
</body>
</html>
